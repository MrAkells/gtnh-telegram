plugins {
    id "java"
    id "com.gtnewhorizons.retrofuturagradle" version "2.0.2"
}

version = project.modVersion
group = project.modGroup
base {
    archivesName = project.modBaseName
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion.set(project.minecraftVersion)
    mcpMappingChannel.set("stable")
    mcpMappingVersion.set("12")
    username.set("Developer")
    javaCompatibilityVersion.set(8)
    // Generates dev.mrakells.gtnhtelegram.Tags, so the version is defined only in gradle.properties.
    injectedTags.put("VERSION", project.version)
    jvmLanguageVersion.set(JavaLanguageVersion.of(8))
}

repositories {
    maven {
        name = "GTNH Maven"
        url = uri("https://nexus.gtnewhorizons.com/repository/public/")
    }
    mavenCentral()
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    compileOnly("com.github.GTNewHorizons:BetterQuesting:${project.betterQuestingVersion}:dev") {
        transitive = false
    }
}

tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = "1.8"
    targetCompatibility = "1.8"
    options.encoding = "UTF-8"
    options.compilerArgs << "-Xlint:-options"
}

tasks.injectTags.configure {
    outputClassName.set("${project.modGroup}.Tags")
}

tasks.test {
    useJUnit()
}

tasks.processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraftVersion
    inputs.property "modid", project.modId
    inputs.property "modname", project.modName

    filesMatching("mcmod.info") {
        expand(
                "version": project.version,
                "mcversion": project.minecraftVersion,
                "modid": project.modId,
                "modname": project.modName
        )
    }
}

tasks.jar {
    manifest {
        attributes(
                "Implementation-Title": project.modName,
                "Implementation-Version": project.version,
                "GTNH-Version": project.gtnhVersion,
                "BetterQuesting-Version": project.betterQuestingVersion
        )
    }
}
